<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Close Button</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        position: relative;
        width: fit-content;
        border: 1px solid black;
        margin: 10px;
        padding: 20px;
      }
      button {
        position: absolute;
        top: 0;
        right: 0;
        margin: 10px;
        padding: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button type="button">x</button>
      <h2>Welcome!</h2>
      <p>This is a modal window</p>
    </div>
  </body>
</html>
