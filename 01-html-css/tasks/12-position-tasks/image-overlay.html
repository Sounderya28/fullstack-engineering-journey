<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Overlay</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        position: relative;
        width: fit-content;
        margin: 10px;
      }
      img {
        width: 300px;
        height: 300px;
        display: block;
      }
      .overlay {
        background-color: rgb(67, 67, 67);
        position: absolute;
        bottom: 0;
        opacity: 0.7;
        width: 100%;
        color: white;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./assets/mountain.jpg" alt="mountain" />
      <div class="overlay">
        <p>Beautiful landscape</p>
        <p>Explore nature →</p>
      </div>
    </div>
  </body>
</html>
