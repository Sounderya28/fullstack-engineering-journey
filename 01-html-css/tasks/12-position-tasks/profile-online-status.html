<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Online Status</title>
    <style>
      .container {
        position: relative;
        width: fit-content;
      }
      .status {
        position: absolute;
        width: 17px;
        height: 17px;
        background-color: green;
        border-radius: 100%;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./assets/profile.png" alt="profile" />
      <div class="status"></div>
    </div>
  </body>
</html>
