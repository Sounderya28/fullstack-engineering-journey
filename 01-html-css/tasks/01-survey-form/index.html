<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>
  <body>
    <h1>FreeCodeCamp Survey Form</h1>
    <p>Thank you for taking the time to help us improve the platform</p>
    <form method="post" id="survey-form" action="#">
      <div>
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        />
      </div>
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>
      <div>
        <label for="age">Age (Optional)</label>
        <input
          type="number"
          id="age"
          name="age"
          min="10"
          max="120"
          placeholder="enter your age"
        />
      </div>
      <div>
        <label for="role">Which option best describes your current role?</label>
        <select id="role" name="role">
          <option selected disabled value="">Select an option</option>
          <option value="student">Student</option>
          <option value="full-time-job">Full Time Job</option>
          <option value="full-time-learner">Full Time Learner</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div>
        <label for="recommend"
          >Would you recommend freeCodeCamp to a friend?</label
        >
        <input
          type="radio"
          id="definitely"
          value="definitely"
          name="recommend"
          checked
        />
        <label for="definitely">Definitely</label>
        <input type="radio" id="may-be" value="may-be" name="recommend" />
        <label for="may-be">May be</label>
        <input type="radio" id="not-sure" value="not-sure" name="recommend" />
        <label for="not-sure">Not Sure</label>
      </div>
      <div>
        <label for="feature"
          >What is your favorite feature of freeCodeCamp?</label
        >
        <select id="feature" name="feature">
          <option selected disabled value="">Select an option</option>
          <option value="challenges">Challenges</option>
          <option value="projects">Projects</option>
          <option value="community">Community</option>
          <option value="open-source">Open Source</option>
        </select>
      </div>
      <div>
        <label for="like"
          >What would you like to see improved? (Check all that apply)</label
        >
        <input
          type="checkbox"
          id="front-end-projects"
          value="front-end-projects"
          name="like"
        />
        <label for="front-end-projects">Front-end Projects</label>
        <input
          type="checkbox"
          id="back-end-projects"
          value="back-end-projects"
          name="like"
        />
        <label for="back-end-projects">Back-end Projects</label>
        <input
          type="checkbox"
          id="data-visualization"
          value="data-visualization"
          name="like"
        />
        <label for="data-visualization">Data Visualization</label>
        <input type="checkbox" id="challenges" value="challenges" name="like" />
        <label for="challenges">Challenges</label>
        <input
          type="checkbox"
          id="open-source-community"
          value="open-source-community"
          name="like"
        />
        <label for="open-source-community">Open Source Community</label>
        <input
          type="checkbox"
          id="gitter-help-rooms"
          value="gitter-help-rooms"
          name="like"
        />
        <label for="gitter-help-rooms">Gitter help rooms</label>
        <input type="checkbox" id="videos" value="videos" name="like" />
        <label for="videos">Videos</label>
        <input
          type="checkbox"
          id="city-meetups"
          value="city-meetups"
          name="like"
        />
        <label for="city-meetups">City Meetups</label>
        <input type="checkbox" id="wiki" value="wiki" name="like" />
        <label for="wiki">Wiki</label>
        <input type="checkbox" id="forum" value="forum" name="like" />
        <label for="forum">Forum</label>
        <input type="checkbox" id="add-ons" value="add-ons" name="like" />
        <label for="add-ons">Additional Courses</label>
      </div>
      <div>
        <label for="comments">Any comments or suggestions?</label>
        <textarea name="comments" id="comments" rows="5"></textarea>
      </div>
      <div>
        <button type="submit" id="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
