<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>
  <body>
    <h1>FreeCodeCamp Survey Form</h1>
    <p>Thank you for taking the time to help us improve the platform</p>
    <form method="post" id="survey-form">
      <div>
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
        />
      </div>
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
        />
      </div>
      <div>
        <label for="age">Age (Optional)</label>
        <input
          type="number"
          id="age"
          name="age"
          min="18"
          max="21"
          placeholder="enter your age"
        />
      </div>
      <div>
        <label for="role">Which option best describes your current role?</label>
        <select for="role">
          <option selected disabled id="placeholder">Select an option</option>
          <option id="student">Student</option>
          <option id="full-time-job">Full Time Job</option>
          <option id="full-time-learner">Full Time Learner</option>
          <option id="prefer-not-to-say">Prefer not to say</option>
          <option id="other">Other</option>
        </select>
      </div>
      <div>
        <label for="recommend"
          >Would you recommend freeCodeCamp to a friend?</label
        >
        <input type="radio" id="definitely" name="definitely" checked />
        <label id="definitely">Definitely</label>
        <input type="radio" id="may-be" name="may-be" />
        <label id="may-be">May be</label>
        <input type="radio" id="not-sure" name="not-sure" />
        <label id="not-sure">Not Sure</label>
      </div>
      <div>
        <label for="feature"
          >What is your favorite feature of freeCodeCamp?</label
        >
        <select for="feature">
          <option selected disabled id="placeholder">Select an option</option>
          <option id="challenges">Challenges</option>
          <option id="projects">Projects</option>
          <option id="community">Community</option>
          <option id="open-source">Open Source</option>
        </select>
      </div>
      <div>
        <label for="like"
          >What would you like to see improved? (Check all that apply)</label
        >
        <input
          type="checkbox"
          id="front-end-projects"
          name="front-end-projects"
        />
        <label id="front-end-projects">Front-end Projects</label>
        <input
          type="checkbox"
          id="back-end-projects"
          name="back-end-projects"
        />
        <label id="back-end-projects">Back-end Projects</label>
        <input
          type="checkbox"
          id="data-visualization"
          name="data-visualization"
        />
        <label id="data-visualization">Data Visualization</label>
        <input type="checkbox" id="challenges" name="challenges" />
        <label id="challenges">Challenges</label>
        <input
          type="checkbox"
          id="open-source-community"
          name="open-source-community"
        />
        <label id="open-source-community">Open Source Community</label>
        <input
          type="checkbox"
          id="gitter-help-rooms"
          name="gitter-help-rooms"
        />
        <label id="gitter-help-rooms">Gitter help rooms</label>
        <input type="checkbox" id="videos" name="videos" />
        <label id="videos">Videos</label>
        <input type="checkbox" id="city-meetups" name="city-meetups" />
        <label id="city-meetups">City Meetups</label>
        <input type="checkbox" id="wiki" name="wiki" />
        <label id="wiki">Wiki</label>
        <input type="checkbox" id="forum" name="forum" />
        <label id="forum">Forum</label>
        <input type="checkbox" id="add-ons" name="add-ons" />
        <label id="add-ons">Additional Courses</label>
      </div>
      <div>
        <label for="comments">Any comments or suggestions?</label>
        <textarea name="comments" id="comments"></textarea>
      </div>
      <div>
        <button typ="submit" id="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
