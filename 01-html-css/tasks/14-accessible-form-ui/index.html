<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  </head>
  <body>
    <form method="post" action="">
      <div class="name">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          aria-required="true"
        />
        <span class="error">Error</span>
      </div>
      <div class="email">
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          required
          aria-required="true"
        />
        <span class="error">Error</span>
      </div>
      <div class="create-password">
        <label for="create-password">Enter Password</label>
        <div class="password-input">
          <input
            type="password"
            id="create-password"
            name="create-password"
            required
            aria-required="true"
          />
          <img
            src="./assets/eye.png"
            alt="display-value"
            width="20px"
            height="20px"
            aria-label="Show password"
          />
        </div>
        <span class="error"></span>
      </div>
      <div class="confirm-password">
        <label for="confirm-password">Confirm Password</label>
        <div class="password-input">
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
            aria-required="true"
          />
          <img
            src="./assets/eye.png"
            alt="display-value"
            width="20px"
            height="20px"
            aria-label="Show password"
          />
        </div>
        <span class="error"></span>
      </div>
    </form>
  </body>
</html>
