<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This is a simple website of price comparison table"
    />
    <meta property="og:title" content="Price Comparison Table" />
    <title>Price Comparison Table</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Acme Plans</h1>
    </header>
    <main>
      <h3>Plan comparison</h3>
      <table>
        <thead>
          <tr>
            <th>Plan</th>
            <th>Storage</th>
            <th>Projects</th>
            <th>Support</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Free</td>
            <td>5 GB</td>
            <td>3</td>
            <td>Email</td>
          </tr>
          <tr>
            <td>Pro</td>
            <td>100 GB</td>
            <td>25</td>
            <td>Priority Email</td>
          </tr>
          <tr>
            <td>Business</td>
            <td>1 TB</td>
            <td>Unlimited</td>
            <td>24/7 Phone</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">All plans include SSL and daily backups</td>
          </tr>
        </tfoot>
      </table>
    </main>
  </body>
</html>
