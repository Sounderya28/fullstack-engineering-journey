<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Business Card</title>
  </head>
  <body>
    <div class="card">
      <div class="personal">
        <img src="./assets/flower.jpg" alt="flower-image" width="100px" />
        <h3 class="name">Sounderya S</h3>
        <h5 class="designation">Software Developer</h5>
        <h6 class="place">@freecodecamp</h6>
      </div>
      <hr />
      <div class="contact">
        <p class="email">Email: sounderya@example.com</p>
        <p class="phone">Phone: (123) 456-7890</p>
        <a
          href="https://www.freecodecamp.org/learn/responsive-web-design-v9"
          class="portfolio"
          >Portfolio</a
        >
      </div>
      <hr />
      <div class="connect">
        <h3>Connect with me</h3>
        <div class="social-links-container">
          <a
            href="https://www.freecodecamp.org/learn/responsive-web-design-v9"
            class="social-link"
            >Twitter</a
          >
          <a
            href="https://www.freecodecamp.org/learn/responsive-web-design-v9"
            class="social-link"
            >LinkedIn</a
          >
          <a
            href="https://www.freecodecamp.org/learn/responsive-web-design-v9"
            class="social-link"
            >Github</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
