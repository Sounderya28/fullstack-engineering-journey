<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <title>Contact Form</title>
  </head>
  <body>
    <form method="post" action="https://roadmap.sh/projects/contact-form">
      <h3>Contact Us</h3>
      <p>Send us a message and we will get back to you.</p>
      <label for="name">
        <span class="label-text">Full name </span>
        <input type="text" id="name" required name="name" />
      </label>
      <label for="email">
        <span class="label-text">Email </span>
        <input type="email" id="email" required name="email" />
      </label>
      <label for="subject">
        <span class="label-text">Subject </span>
        <select id="subject">
          <option value="" disabled selected hidden>Choose a topic</option>
          <option value="English" name="subject">English</option>
          <option value="Maths" name="subject">Maths</option>
          <option value="Science" name="subject">Science</option>
        </select>
      </label>
      <label for="message">
        <span class="label-text">Message</span>
        <textarea
          id="message"
          required
          minlength="20"
          name="message"
        ></textarea>
      </label>
      <fieldset>
        <legend>How did you hear about us?</legend>
        <label for="search"
          ><input
            type="radio"
            id="search"
            value="search"
            name="source"
          />Search</label
        >
        <label for="friend"
          ><input
            type="radio"
            id="friend"
            value="friend"
            name="source"
          />Friend</label
        >
        <label for="social-media"
          ><input
            type="radio"
            id="social-media"
            value="social-media"
            name="source"
          />Social Media</label
        >
      </fieldset>
      <label for="newsletter">
        <input type="checkbox" id="newsletter" name="newsletter" />Send me
        product updates
      </label>
      <button type="submit">Send Message</button>
    </form>
  </body>
</html>
