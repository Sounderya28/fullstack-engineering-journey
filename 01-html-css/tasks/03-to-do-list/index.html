<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>My To-Do List</title>
  </head>
  <body>
    <div class="container">
      <h2>My To-Do List</h2>
      <div class="list">
        <div class="each-list">
          <input type="checkbox" id="keyboards" name="keyboards" />
          <label for="keyboards">Explore gaming keyboards</label>
          <ul>
            <li>
              <a href="https://www.freecodecamp.org/learn/">Store link</a>
            </li>
          </ul>
        </div>
        <div class="each-list">
          <input type="checkbox" id="report" name="report" />
          <label for="report">Finish the report</label>
          <ul>
            <li>
              <a href="https://www.freecodecamp.org/learn/">Request Access</a>
            </li>
          </ul>
        </div>
        <div class="each-list">
          <input type="checkbox" id="warranty" name="warranty" />
          <label for="warranty">View Phone's Warranty</label>
          <ul>
            <li>
              <a href="https://www.freecodecamp.org/learn/">View Receipts</a>
            </li>
          </ul>
        </div>
        <div class="each-list">
          <input type="checkbox" id="processor" name="processor" />
          <label for="processor">Check Processor Specs</label>
          <ul>
            <li>
              <a href="https://www.freecodecamp.org/learn/"
                >View Model Number</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
